name: Build Pure Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'

jobs:
  build-native:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Kodu İndir
        uses: actions/checkout@v4

      - name: ☕ Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Gradle ile APK Derle
        working-directory: ./android-native
        run: |
          gradle assembleDebug --stacktrace > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }

      - name: 🚀 APK'yı Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Plaka-Sistemi-Native-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
