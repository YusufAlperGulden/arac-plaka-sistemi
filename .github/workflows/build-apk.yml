name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Kodu İndir
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Capacitor Kurulumu
        run: |
          npm init -y
          # Install core, android, and camera plugin to automatically inject camera permissions
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera
          
          mkdir -p www
          echo "<html><head><meta http-equiv='refresh' content='0; url=https://arac-plaka-sistemi.onrender.com' /></head><body>Yönlendiriliyor...</body></html>" > www/index.html
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.teknopalas.aracplaka",
            "appName": "Plaka Sistemi",
            "webDir": "www",
            "server": {
              "url": "https://arac-plaka-sistemi.onrender.com",
              "cleartext": true
            }
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: 📦 Gradle ile APK Derle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 🚀 APK'yı Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Plaka-Sistemi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
