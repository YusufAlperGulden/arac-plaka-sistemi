name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace > build_log.txt 2>&1 || true

      - name: Push Logs
        if: always()
        run: |
          git config --global user.name "Log Bot"
          git config --global user.email "bot@example.com"
          git checkout -B debug-logs-build-apk
          cp android-app/build_log.txt ./build_log_build-apk.txt || true
          git add build_log_build-apk.txt
          git commit -m "Logs" || true
          git push origin debug-logs-build-apk -f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arac-Plaka-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Error-Log-build-apk.yml
          path: android-app/build_log.txt
          retention-days: 1
