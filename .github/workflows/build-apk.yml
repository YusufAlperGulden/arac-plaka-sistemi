name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Kodu İndir
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Java JDK Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Capacitor ve Gerekli Kütüphaneleri Kur
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Create a dummy www folder to satisfy Capacitor
          mkdir -p www
          echo "<html><body>Redirecting...</body></html>" > www/index.html
          
          # Capacitor yapılandırma dosyası oluşturuluyor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.teknopalas.aracplaka",
            "appName": "Plaka Sistemi",
            "webDir": "www",
            "server": {
              "url": "https://arac-plaka-sistemi.onrender.com",
              "cleartext": true
            }
          }
          EOF
          
          # Android platformunu ekle
          npx cap add android
          npx cap sync android

      - name: 📷 Android İzinlerini (Kamera/İnternet) Ekle
        run: |
          python -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if not os.path.exists(manifest_path):
              print('Manifest not found!')
              exit(1)
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          permissions = '''    <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"true\" />
          '''
          
          content = content.replace('<application', permissions + '\n    <application')
          with open(manifest_path, 'w') as f:
              f.write(content)
          print('Permissions injected.')
          "

      - name: 📦 Gradle ile APK Derle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 APK'yı GitHub Actions'a Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Plaka-Sistemi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
