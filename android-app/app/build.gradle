plugins {
    id "com.android.application"
}

android {
    namespace "com.teknopalas.aracplaka"
    compileSdk 35

    defaultConfig {
        applicationId "com.teknopalas.aracplaka"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Installable internal-distribution APK. Replace this development
            // signing config with an organization-owned keystore for Play Store.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
